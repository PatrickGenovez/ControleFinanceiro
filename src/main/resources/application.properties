# Configuração de Conexão com o MySQL
# Os valores podem ser sobrescritos por variáveis de ambiente (ex: export DB_PASSWORD=suaSenha)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/controle_financeiro?useTimezone=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
